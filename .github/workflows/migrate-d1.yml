name: Inspect CodFlow D1 migrations

on:
workflow_dispatch:

jobs:
inspect:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

```
  - name: Show migration files
    run: |
      echo "=== Migration files ==="
      find cod-server/src/db/migrations -maxdepth 2 -type f -print
      echo "=== Available migration scripts ==="
      node -e "const p=require('./cod-server/package.json'); console.log(JSON.stringify(p.scripts,null,2))"
```
