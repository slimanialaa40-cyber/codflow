
name = "codflow-dashboard"
compatibility_date = "2026-08-25"
compatibility_flags = [
  "nodejs_compat",
  "disable_nodejs_process_v2",
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api/auth/*",
  "/mcp/oauth/login",
  "/reset-password/*",
]

[[d1_databases]]
binding = "DB"
database_name = "codflow-os-db"
database_id = "e0b285d3-0f64-44b2-a797-4aa3d03ac88f"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6cd894eb1c4444b0b20f56ba4d739435"

[vars]
PUBLIC_APP_URL = "https://codflow-dashboard.slimanialaa40.workers.dev"
PUBLIC_API_URL = "https://codflow.slimanialaa40.workers.dev"
PUBLIC_TRUSTED_ORIGINS = "https://codflow-dashboard.slimanialaa40.workers.dev"

[observability]
enabled = true

[dev]
port = 8788
